apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-fixture.fullname" . }}
  labels:
    {{- include "agents-fixture.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agents-fixture.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "agents-fixture.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "agents-fixture.serviceAccountName" . }}
      containers:
        - name: api
          image: {{ include "agents-fixture.image" . | quote }}
          command: ["/app/api"]
          envFrom:
            - configMapRef:
                name: {{ include "agents-fixture.fullname" . }}
          ports:
            - name: http
              containerPort: 8080
