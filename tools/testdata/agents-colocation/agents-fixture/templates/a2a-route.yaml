{{- if and .Values.a2a.enabled .Values.a2a.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agents-fixture.a2aFullname" . }}
  labels:
    {{- include "agents-fixture.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  {{- with include "agents-fixture.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.a2a.route.parentRefs | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "agents-fixture.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
